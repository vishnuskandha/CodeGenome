name: Bug report
about: Create a report to help us improve CodeGenome
title: "[BUG] "
labels: bug
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: The GitHub URL you were trying to analyze when the bug occurred.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        1. Run `python codegenome_v2.py`
        2. Enter URL ...
        3. See error ...
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs/Error Traceback
      description: Please paste any error messages or stack traces here.
      render: shell
